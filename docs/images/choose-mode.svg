<text x="740" y="313.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">无法重建?</text>
<rect x="920" y="264" width="150" height="72" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#sh)"/>
<text x="995.0" y="296.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">microVM</text>
<text x="995.0" y="315.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">自建 arm64 镜像</text>
<rect x="125" y="470" width="690" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#sh)"/>
<text x="470.0" y="499.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Runtime Instances</text>
<text x="470.0" y="518.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">原始镜像 + 通用模板；实例族、根卷 / EBS 按 cpus、memory_mb、storage_mb 设置</text>
<text x="1160" y="290" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">判断依据：</text>
<text x="1160" y="308" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">task.toml 的 cpus /</text>
<text x="1160" y="326" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">memory_mb / storage_mb</text>
<text x="1160" y="344" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">/ gpus，以及镜像</text>
<text x="20" y="572" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">注：图中阈值（镜像 3 GB、microVM 2 vCPU / 8 GB 等）为默认配额，可联系 AgentCore service team 申请调整。</text>
