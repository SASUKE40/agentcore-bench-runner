<text x="830.0" y="227.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">保活入口 + 缺失时补 curl，所有任务相同</text>
<rect x="640" y="280" width="380" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="830.0" y="308.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">CreateAgentRuntime</text>
<text x="830.0" y="327.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">+ capacityProviderConfiguration</text>
<rect x="640" y="380" width="380" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="830.0" y="408.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">你账户里的 EC2</text>
<text x="830.0" y="427.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">实例族自选：CPU / 内存 / GPU / 磁盘</text>
<rect x="640" y="474" width="145" height="28" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="712.5" y="493" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">创建约 10 s / 镜像</text>
<rect x="797" y="474" width="111" height="28" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="852.5" y="493" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">冷启动约 43 s</text>
<rect x="920" y="474" width="122" height="28" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="981.0" y="493" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">x86_64 / arm64</text>
