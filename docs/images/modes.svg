<text x="290.0" y="408.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">AgentCore 托管 microVM</text>
<text x="290.0" y="427.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">2 vCPU / 8 GB，约 5 GiB 可写</text>
