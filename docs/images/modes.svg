<text x="290.0" y="127.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">内容不改</text>
<rect x="100" y="180" width="380" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="290.0" y="208.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">在 arm64 机器上构建</text>
<text x="290.0" y="227.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">docker build --platform linux/arm64</text>
