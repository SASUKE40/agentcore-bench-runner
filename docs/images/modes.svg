<path d="M830,244 V278" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-green)"/>
<path d="M830,344 V378" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="640" y="80" width="380" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="830.0" y="108.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">原始任务镜像</text>
<text x="830.0" y="127.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">task.toml 的 docker_image，不改</text>
<rect x="640" y="180" width="380" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
