<text x="290.0" y="308.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">CreateHarness</text>
<text x="290.0" y="327.0" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">同镜像复用，harness 保持会话</text>
