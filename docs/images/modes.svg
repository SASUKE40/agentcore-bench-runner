<path d="M290,244 V278" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M290,344 V378" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="100" y="80" width="380" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
