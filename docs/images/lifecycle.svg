<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<defs>
<marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
<marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.08"/></filter>
</defs>
<rect width="1120" height="800" fill="#ffffff"/>
<rect data-graph-role="background" x="20" y="90" width="1080" height="234" rx="10" fill="#eff6ff" opacity="0.55"/>
<text x="34" y="110" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start">submit：客户端发起，完成后即返回</text>
<rect data-graph-role="background" x="20" y="330" width="1080" height="314" rx="10" fill="#f0fdfa" opacity="0.55"/>
<text x="34" y="350" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start">沙箱内自行完成（客户端不参与）</text>
<rect data-graph-role="background" x="20" y="650" width="1080" height="92" rx="10" fill="#f0fdf4" opacity="0.55"/>
<text x="34" y="670" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start">results：客户端随时读取</text>
<line x1="120" y1="84" x2="120" y2="770" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="30" y="40" width="180" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="120.0" y="67.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">客户端 bench.py</text>
<line x1="340" y1="84" x2="340" y2="770" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="250" y="40" width="180" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#sh)"/>
<text x="340.0" y="67.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">AgentCore 控制面</text>
<line x1="580" y1="84" x2="580" y2="770" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="490" y="40" width="180" height="44" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" filter="url(#sh)"/>
<text x="580.0" y="67.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">沙箱 trial.sh</text>
<line x1="800" y1="84" x2="800" y2="770" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="710" y="40" width="180" height="44" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#sh)"/>
<text x="800.0" y="67.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Bedrock</text>
<line x1="1000" y1="84" x2="1000" y2="770" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="910" y="40" width="180" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#sh)"/>
<text x="1000.0" y="67.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">S3</text>
<path d="M124,135 H996" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect data-graph-role="label" x="458.5" y="114" width="203" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="560.0" y="127" font-size="12" font-weight="500" fill="#16a34a" text-anchor="middle">1  上传 tests.tgz 到 inputs/</text>
<path d="M124,183 H336" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect data-graph-role="label" x="143.0" y="162" width="174" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="230.0" y="175" font-size="12" font-weight="500" fill="#2563eb" text-anchor="middle">2  确保沙箱（同镜像复用）</text>
<text x="230.0" y="199" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">首次创建并等待 READY</text>
<path d="M124,241 H576" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect data-graph-role="label" x="236.0" y="220" width="228" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="350.0" y="233" font-size="12" font-weight="500" fill="#2563eb" text-anchor="middle">3  install.sh 安装 agent（同步）</text>
<path d="M124,289 H576" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect data-graph-role="label" x="221.5" y="268" width="257" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="350.0" y="281" font-size="12" font-weight="500" fill="#2563eb" text-anchor="middle">4  送入 trial.sh 并后台启动，立即返回</text>
<text x="350.0" y="305" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">客户端到此结束</text>
<path d="M584,375 H796" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#a-purple)"/>
<rect data-graph-role="label" x="595.0" y="354" width="190" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="690.0" y="367" font-size="12" font-weight="500" fill="#9333ea" text-anchor="middle">5  agent 前台运行，调用模型</text>
<text x="690.0" y="391" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">agent 进程退出即进入下一步</text>
<path d="M584,433 H996" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect data-graph-role="label" x="695.0" y="412" width="190" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="790.0" y="425" font-size="12" font-weight="500" fill="#16a34a" text-anchor="middle">6  取回 tests.tgz → /tests</text>
<rect x="590" y="465" width="320" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="598" y="482" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">7  执行 tests/test.sh → /logs/verifier/reward.txt</text>
<path d="M584,525 H996" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect data-graph-role="label" x="636.5" y="504" width="307" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="790.0" y="517" font-size="12" font-weight="500" fill="#16a34a" text-anchor="middle">8  上传 reward / ctrf / 日志 / summary.json</text>
<path d="M576,573 H344" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect data-graph-role="label" x="342.5" y="552" width="235" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="460.0" y="565" font-size="12" font-weight="500" fill="#2563eb" text-anchor="middle">9  StopRuntimeSession（释放自身）</text>
<path d="M124,700 H996" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#a-green)"/>
<rect data-graph-role="label" x="428.5" y="679" width="263" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="560.0" y="692" font-size="12" font-weight="500" fill="#16a34a" text-anchor="middle">10  results：读取 summary.json 与日志</text>
<line x1="40" y1="778" x2="70" y2="778" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="78" y="782" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">AgentCore API</text>
<line x1="203" y1="778" x2="233" y2="778" stroke="#9333ea" stroke-width="1.8" marker-end="url(#a-purple)"/>
<text x="241" y="782" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">模型调用</text>
<line x1="327" y1="778" x2="357" y2="778" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-green)"/>
<text x="365" y="782" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">S3 读写</text>
</svg>